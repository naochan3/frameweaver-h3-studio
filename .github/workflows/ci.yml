name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Frontend unit, lint, and build
        run: |
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high

      - name: Browser E2E
        run: |
          npx playwright install chromium
          npm run test:e2e

      - name: Rust checks
        working-directory: frameweaverd
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Rust advisory audit
        working-directory: frameweaverd
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          # SQLx's macro metadata locks an unused MySQL/RSA package. `cargo tree -i rsa`
          # is empty for every build target; RUSTSEC-2023-0071 has no patched release.
          cargo audit --ignore RUSTSEC-2023-0071

      - name: PowerShell contracts
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          Invoke-Pester -Path './scripts/tests' -EnableExit
